
name: PostgreSQL DBA Agent CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run PostgreSQL DBA Agent Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.2.0" "psycopg[binary]>=3.2,<4" "sqlglot==30.33.0"

      - name: Run test suite
        run: |
          python -m pytest -q tests/diagnostics tests/quality tests/test_execution_broker.py tests/sql_validation
